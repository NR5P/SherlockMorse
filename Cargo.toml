[package]
name = "cwskimmer"
version = "0.2.0"
edition = "2021"
description = "CW (Morse) skimmer with probabilistic decoding and CAT radio control"
license = "GPL-3.0-or-later"
default-run = "cwskimmer"

[lib]
name = "cwskimmer"
path = "src/lib.rs"

[[bin]]
name = "cwskimmer"
path = "src/main.rs"

[[bin]]
name = "cwtool"
path = "src/bin/cwtool.rs"

[dependencies]
anyhow = "1"
rustfft = "6"
num-complex = "0.4"
cpal = "0.15"
serialport = "4"
hound = "3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "aac", "isomp4", "ogg", "vorbis", "flac"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
ureq = "2"
rand = "0.8"
rand_distr = "0.4"
png = "0.17"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 2
